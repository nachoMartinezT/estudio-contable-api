spring.application.name=afip-service
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guida_contable}
spring.datasource.username=${DB_USER:guida_user}
spring.datasource.password=${DB_PASSWORD:password123}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.initialization-fail-timeout=-1

# URLs AFIP por ambiente. El servicio elige homologacion/produccion segun la config del tenant.
afip.wsaa.homologacion-url=${AFIP_WSAA_HOMOLOGACION_URL:https://wsaahomo.afip.gov.ar/ws/services/LoginCms}
afip.wsaa.produccion-url=${AFIP_WSAA_PRODUCCION_URL:https://wsaa.afip.gov.ar/ws/services/LoginCms}
afip.wsfe.homologacion-url=${AFIP_WSFE_HOMOLOGACION_URL:https://wswhomo.afip.gov.ar/wsfev1/service.asmx}
afip.wsfe.produccion-url=${AFIP_WSFE_PRODUCCION_URL:https://servicios1.afip.gov.ar/wsfev1/service.asmx}

# Internal service URLs
services.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
internal.api.key=${INTERNAL_API_KEY:defaultInternalKey}
